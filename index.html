<!DOCTYPE html>
<html lang="en" data-theme="daylight" data-wallpaper="sky" data-motion="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AskVerity OS</title>
    <meta
      name="description"
      content="AskVerity OS is a friendly, self-contained desktop environment in your browser, with Verity: a local-first assistant with a yellow smiley face."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="assets/verity.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/desktop.css" />
    <link rel="stylesheet" href="css/windows.css" />
    <link rel="stylesheet" href="css/applications.css" />
    <link rel="stylesheet" href="css/retro.css" />
    <link rel="stylesheet" href="css/browser.css" />
  </head>
  <body>
    <a class="skip-link" href="#desktop-surface">Skip to desktop</a>

    <div class="os" id="os">
      <main class="desktop" id="desktop-surface" aria-label="AskVerity desktop">
        <div class="desktop__texture" aria-hidden="true"></div>

        <div
          class="desktop__icons"
          id="desktop-icons"
          role="group"
          aria-label="Desktop applications. Press Enter on an icon to open it."
        ></div>

        <div class="window-layer" id="window-layer"></div>

        <p class="desktop__tip" id="desktop-tip">
          <span class="desktop__tip-dot" aria-hidden="true"></span>
          Double-click an icon, or open the Start menu.
        </p>
      </main>

      <div class="taskbar" id="taskbar">
        <button
          class="start-button"
          id="start-button"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="start-menu"
        >
          <span class="start-button__face" id="start-button-face" aria-hidden="true"></span>
          <span class="start-button__label">Start</span>
        </button>

        <div class="taskbar__apps" id="taskbar-apps" role="group" aria-label="Open windows"></div>

        <div class="taskbar__tray">
          <button
            class="tray__pill"
            id="tray-status"
            type="button"
            title="Assistant status"
            aria-label="Assistant status"
          >
            <span class="dot" id="tray-status-dot" aria-hidden="true"></span>
            <span class="tray__pill-text" id="tray-status-text">Checking…</span>
          </button>
          <button class="tray__clock" id="tray-clock" type="button" aria-label="Date and time">
            <span class="tray__time" id="tray-time">--:--</span>
            <span class="tray__date" id="tray-date">—</span>
          </button>
        </div>
      </div>
    </div>

    <div class="start-menu" id="start-menu" role="dialog" aria-label="Start menu" hidden></div>

    <div class="context-menu" id="context-menu" role="menu" aria-label="Desktop menu" hidden></div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <div class="welcome" id="welcome" role="dialog" aria-modal="true" aria-labelledby="welcome-title" hidden></div>

    <noscript>
      <div class="noscript">
        <h1>AskVerity OS needs JavaScript</h1>
        <p>The desktop is a small operating system built from HTML, CSS and JavaScript. Please enable JavaScript to meet Verity.</p>
      </div>
    </noscript>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
